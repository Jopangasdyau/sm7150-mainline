name: surya mainline kernel build

on:
  push:
    branches: [ v7.1 ]
  workflow_dispatch:
    inputs:
      ref:
        description: "branch/tag/commit to build"
        required: false
        default: "v7.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT: out
  FRAGMENT: sm7150.config ci-selinux.config
  DTB_NAME: sm7150-xiaomi-surya-huaxing.dtb
  STOCK_BOOT_URL: https://mirrorbits.lineageos.org/full/surya/20260727/boot.img
  CMDLINE: "console=ttyMSM0,115200n8 earlycon androidboot.selinux=permissive"
  HEADER_VERSION: "2"
  PAGESIZE: "4096"
  BASE: "0x00000000"
  KERNEL_OFFSET: "0x00008000"
  RAMDISK_OFFSET: "0x01000000"
  TAGS_OFFSET: "0x00000100"
  DTB_OFFSET: "0x01f00000"
  SECOND_OFFSET: "0x00f00000"
  OS_VERSION: "10.0.0"
  OS_PATCH_LEVEL: "2020-08"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-surya-${{ github.sha }}
          restore-keys: ccache-surya-

      - name: build
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libelf-dev dwarves device-tree-compiler ccache curl
          export CROSS_COMPILE="ccache $CROSS_COMPILE"
          ccache -M 5G

          git clone --depth=1 https://github.com/osm0sis/mkbootimg mkbootimg-tool
          make -C mkbootimg-tool CROSS_COMPILE=

          # stock ramdisk pulled from a lineage nightly — URL is date-pinned,
          # will 404 once that build rotates off the mirror, repoint as needed
          curl -fL "$STOCK_BOOT_URL" -o stock_boot.img
          mkdir -p unpacked
          ./mkbootimg-tool/unpackbootimg -i stock_boot.img -o unpacked
          RAMDISK=$(ls unpacked/stock_boot.img-ramdisk* | head -n1)

          mkdir -p kernel/configs
          printf '%s\n' 'CONFIG_SECURITY_SELINUX=y' 'CONFIG_SECURITY_SELINUX_FS=y' \
            > kernel/configs/ci-selinux.config

          make ARCH=$ARCH CROSS_COMPILE="$CROSS_COMPILE" O=$OUT defconfig $FRAGMENT
          make ARCH=$ARCH CROSS_COMPILE="$CROSS_COMPILE" O=$OUT -j"$(nproc)" Image.gz dtbs

          DTB=$(find $OUT/arch/arm64/boot/dts -iname "$DTB_NAME" | head -n1)
          [ -n "$DTB" ] || { echo "::error::$DTB_NAME not found"; exit 1; }

          ./mkbootimg-tool/mkbootimg \
            --kernel "$OUT/arch/arm64/boot/Image.gz" \
            --ramdisk "$RAMDISK" \
            --dtb "$DTB" \
            --header_version "$HEADER_VERSION" \
            --base "$BASE" \
            --kernel_offset "$KERNEL_OFFSET" \
            --ramdisk_offset "$RAMDISK_OFFSET" \
            --tags_offset "$TAGS_OFFSET" \
            --dtb_offset "$DTB_OFFSET" \
            --second_offset "$SECOND_OFFSET" \
            --pagesize "$PAGESIZE" \
            --os_version "$OS_VERSION" \
            --os_patch_level "$OS_PATCH_LEVEL" \
            --cmdline "$CMDLINE" \
            -o boot.img

          cp "$OUT/arch/arm64/boot/Image.gz" .
          cp "$DTB" ./surya.dtb

      - uses: actions/upload-artifact@v4
        with:
          name: surya-${{ github.sha }}
          path: |
            boot.img
            Image.gz
            surya.dtb
          retention-days: 14
